{% extends "base.html" %}
{% block title %}Eliminar · Cafetería Fiores{% endblock %}
{% block content %}
<div class="card shadow-sm border-danger">
  <div class="card-body">
    <h1 class="h4 text-danger">Confirmar eliminación</h1>
    <p>¿Seguro que quieres eliminar {{ tipo }} <strong>{{ objeto }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{{ volver }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
