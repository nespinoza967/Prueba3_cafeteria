{% extends "base.html" %}
{% block title %}Iniciar sesión · Cafetería Fiores{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3 text-center">Iniciar sesión</h1>
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control" value="{{ form.username.value|default:'' }}" required autofocus>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-verde w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
