{% load formato %}
<div class="table-responsive">
  <table class="table table-sm mb-0">
    <thead><tr><th>Producto</th><th class="text-end">Cant.</th><th class="text-end">Precio</th><th class="text-end">Subtotal</th></tr></thead>
    <tbody>
      {% for d in pedido.detalles.all %}
        <tr>
          <td>{{ d.producto.nombre }}</td>
          <td class="text-end">{{ d.cantidad }}</td>
          <td class="text-end">{{ d.precio_unitario|clp }}</td>
          <td class="text-end">{{ d.subtotal|clp }}</td>
        </tr>
      {% endfor %}
    </tbody>
    <tfoot><tr><th colspan="3" class="text-end">Total</th><th class="text-end">{{ pedido.total|clp }}</th></tr></tfoot>
  </table>
</div>
